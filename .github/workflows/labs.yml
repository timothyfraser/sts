# Lab gate: runs tools/verify/verify_lab.mjs (checks a-i) for every lab under docs-v3/labs/.
# --self-test first proves the gate itself still fails when it should (tests/labs/fixtures/).
name: labs

on:
  pull_request:
    branches: [v2027]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/verify/package-lock.json

      - name: Install verify deps
        working-directory: tools/verify
        run: npm ci

      - name: Install Chromium
        working-directory: tools/verify
        run: npx playwright install --with-deps chromium

      - name: Gate self-test (fixtures must pass / fail as labelled)
        run: node tools/verify/verify_lab.mjs --self-test

      - name: Gate every lab under docs-v3/labs/
        run: node tools/verify/verify_lab.mjs --all

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-shots
          path: tests/labs/shots/
          if-no-files-found: ignore
          retention-days: 14
