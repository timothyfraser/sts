# STS v2027 — deploy docs-v3/ as a static site to Posit Connect.
# Ported from sigma's .github/workflows/deploy-connect.yml (2026-09-29): same
# idempotent content-by-name resolution, same fire-and-forget publish script,
# same vanity-path step. Repo secrets: CONNECT_SERVER, CONNECT_API_KEY.
#
# Which org hosts the site is not settled (Tim, 2026-09-29). This workflow is
# org-agnostic on purpose: moving it means changing the two secrets and, if the
# content name or path must change, the two values below — nothing in docs-v3/.
#
# Idempotent by design: resolves (or creates once) the content item NAMED
# "sts", deploys every bundle to that same GUID — never a duplicate app — and
# ensures the /sts/ vanity path. Until v2027 merges into main, pushes to v2027
# deploy; after the merge, main does. Never both live at once: the concurrency
# group serialises them and the later push wins.
#
# The publish step is FIRE-AND-FORGET: upload, deploy, watch 120 s for an
# immediate failure, then detach with exit 0. A run reports exactly one of
# three outcomes in words: FAILED FAST, RENDERED IN BUDGET, or DETACHED.
name: deploy-connect

on:
  push:
    branches: [v2027, main]
    paths:
      - "docs-v3/**"
      - ".github/workflows/deploy-connect.yml"
      - ".github/scripts/connect-publish-static-async.sh"
  workflow_dispatch:

env:
  CONTENT_NAME: sts
  CONTENT_TITLE: "STS - Data Science for Socio-Technical Systems"
  VANITY_PATH: /sts/

concurrency:
  group: deploy-connect
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run without secrets
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
        run: |
          [ -n "$CONNECT_SERVER" ] && [ -n "$CONNECT_API_KEY" ] \
            || { echo "::error::CONNECT_SERVER / CONNECT_API_KEY repo secrets are not set on this repo. Add them (Settings > Secrets and variables > Actions) — same values as sigma's."; exit 1; }

      - name: Resolve or create the content item
        id: content
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
        run: |
          base="${CONNECT_SERVER%/}"
          guid=$(curl -fsS -H "Authorization: Key $CONNECT_API_KEY" \
            "$base/__api__/v1/content?name=${CONTENT_NAME}" | jq -r '.[0].guid // empty')
          if [ -z "$guid" ]; then
            guid=$(curl -fsS -X POST -H "Authorization: Key $CONNECT_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${CONTENT_NAME}\",\"title\":\"${CONTENT_TITLE}\",\"access_type\":\"all\"}" \
              "$base/__api__/v1/content" | jq -r '.guid')
            echo "created content item ${CONTENT_NAME}"
          else
            echo "found existing content item ${CONTENT_NAME}"
          fi
          [ -n "$guid" ] && [ "$guid" != "null" ] || { echo "::error::could not resolve content GUID"; exit 1; }
          echo "guid=$guid" >> "$GITHUB_OUTPUT"

      - name: Publish docs-v3 to Posit Connect (async)
        id: publish_async
        timeout-minutes: 15
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONTENT_GUID: ${{ steps.content.outputs.guid }}
          BUNDLE_DIR: docs-v3
          ENTRYPOINT: index.html
          POLL_BUDGET_SECONDS: "120"
          POLL_WAIT_SECONDS: "10"
        run: bash .github/scripts/connect-publish-static-async.sh

      - name: Ensure the vanity URL
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONTENT_GUID: ${{ steps.content.outputs.guid }}
        run: |
          base="${CONNECT_SERVER%/}"
          curl -fsS -X PUT -H "Authorization: Key $CONNECT_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"${VANITY_PATH}\"}" \
            "$base/__api__/v1/content/${CONTENT_GUID}/vanity" \
            && echo "vanity ${VANITY_PATH} confirmed" \
            || echo "::warning::vanity PUT failed (path may already be claimed) - site still reachable at its GUID URL"

      - name: Smoke check
        if: steps.publish_async.outputs.deploy_status == 'succeeded'
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
        run: |
          base="${CONNECT_SERVER%/}"
          for p in "${VANITY_PATH}" "${VANITY_PATH}labs/index.html"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$base$p")
            echo "GET $p -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error::smoke check failed on $p"; exit 1; }
          done

      - name: Report publish outcome
        if: always() && steps.publish_async.conclusion != 'skipped'
        env:
          DEPLOY_STATUS: ${{ steps.publish_async.outputs.deploy_status }}
          TASK_ID: ${{ steps.publish_async.outputs.task_id }}
          BUNDLE_ID: ${{ steps.publish_async.outputs.bundle_id }}
          STEP_OUTCOME: ${{ steps.publish_async.outcome }}
        run: |
          echo "deploy_status=${DEPLOY_STATUS:-<none>} bundle=${BUNDLE_ID:-<none>} task=${TASK_ID:-<none>}"
          case "$DEPLOY_STATUS" in
            succeeded) echo "RENDERED IN BUDGET - the new bundle is live at ${VANITY_PATH} and the smoke check tested it." ;;
            detached)  echo "DETACHED - upload + deploy accepted; Connect finishes server-side. Green means accepted, not live; see the Connect content log." ;;
            *)         echo "FAILED FAST - the publish step ended as '${STEP_OUTCOME}'. The reason is in its log."; exit 1 ;;
          esac
