<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture lab (impeccable finding)</title>
<link rel="icon" href="data:,">
<!-- Self-contained gate fixture. It implements window.__lab and the learning-check DOM
     by hand (no kit) so the gate can be tested on its own. ?fault=<name> breaks exactly one
     thing: readout | code | lc | payload | axe | scroll | console | slow. -->
<style>
  :root { --bg: #ffffff; --fg: #1a1a2e; --bench: #2a1f5c; --bench-fg: #f4f2ff; --line: #6b6b80; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121220; --fg: #ecebf5; --line: #9a9ab0; } }
  :root[data-theme="dark"] { --bg: #121220; --fg: #ecebf5; --line: #9a9ab0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  h1 { background: linear-gradient(90deg, #1a1a2e, #2a1f5c); -webkit-background-clip: text; background-clip: text; color: var(--fg); }
  main { max-width: 720px; margin: 0 auto; }
  .bench { background: var(--bench); color: var(--bench-fg); padding: 16px; border-radius: 8px; }
  .bench label { display: block; }
  pre { white-space: pre-wrap; background: #0e0b24; color: #f4f2ff; padding: 8px; border-radius: 6px; }
  button { font: inherit; padding: 6px 10px; margin: 4px 4px 4px 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; }
  .is-correct { outline: 3px solid #2e7d32; } .is-wrong { outline: 3px solid #c62828; }
  .lab-lc { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 16px; }
</style>
</head>
<body data-lab="fx">
<main>
  <h1>Fixture lab</h1>
  <section class="bench" aria-label="Bench">
    <label for="n">Values used: <output id="nout">5</output></label>
    <input id="n" type="range" min="1" max="5" value="5">
    <dl>
      <dt>Sum</dt><dd id="r-sum"></dd>
      <dt>Mean</dt><dd id="r-mean"></dd>
    </dl>
  </section>
  <div class="lab-code" data-lab-code>
    <button data-code-tab="r">R</button><button data-code-tab="sql">SQL</button>
    <button data-code-copy>Copy</button>
    <pre data-code-pane="r"><code></code></pre>
    <pre data-code-pane="sql" hidden><code></code></pre>
  </div>
  <div id="lcs"></div>
  <div id="extra"></div>
</main>
<script>
(function () {
  const fault = new URLSearchParams(location.search).get('fault') || '';
  let values = [], state = { n: 5 };
  const $ = (s) => document.querySelector(s);
  function codeFor(n) {
    const r = 'x <- values[1:' + n + ']\nsum(x)\nmean(x)';
    const sql = 'SELECT SUM(v), AVG(v)\nFROM vals\nWHERE i <= ' + n + ';';
    return fault === 'code' ? { r: r.replace('sum(x)', 'sum(x, na.rm = TRUE)'), sql } : { r, sql };
  }
  function readouts() {
    const x = values.slice(0, state.n);
    const sum = x.reduce((a, b) => a + b, 0);
    let mean = sum / x.length;
    if (fault === 'readout') mean += 1e-3;
    return { n: state.n, sum, mean, label: 'first ' + state.n };
  }
  function render() {
    const r = readouts(), c = codeFor(state.n);
    $('#n').value = state.n; $('#nout').textContent = state.n;
    $('#r-sum').textContent = r.sum.toFixed(3); $('#r-mean').textContent = r.mean.toFixed(3);
    $('[data-code-pane="r"] code').textContent = c.r;
    $('[data-code-pane="sql"] code').textContent = c.sql;
  }
  function lc(i, correctIdx) {
    const s = document.createElement('section');
    s.className = 'lab-lc'; s.dataset.lc = String(i);
    s.innerHTML = '<h3>Check ' + i + '</h3><p class="lc-q">Which option is right?</p>' +
      '<div class="lc-options" role="group" aria-label="Options for check ' + i + '">' +
      [0, 1, 2].map((k) => '<button class="lc-option" data-correct="' + (k === correctIdx) + '">Option ' + (k + 1) + '</button>').join('') +
      '</div><button class="lc-hint-btn" aria-expanded="false">Hint</button><div class="lc-hint" hidden>Think about it.</div>' +
      '<button class="lc-reveal-btn" aria-expanded="false">Reveal answer</button><div class="lc-answer" hidden>Option ' + (correctIdx + 1) + '.</div>';
    s.querySelectorAll('.lc-option').forEach((b) => b.addEventListener('click', () => {
      s.querySelectorAll('.lc-option').forEach((o) => o.classList.remove('is-chosen', 'is-correct', 'is-wrong'));
      b.classList.add('is-chosen', b.dataset.correct === 'true' ? 'is-correct' : 'is-wrong');
    }));
    const tog = (btn, el) => btn.addEventListener('click', () => {
      if (fault === 'lc' && i === 2 && btn.classList.contains('lc-reveal-btn')) return; // broken reveal
      el.hidden = !el.hidden; btn.setAttribute('aria-expanded', String(!el.hidden));
    });
    tog(s.querySelector('.lc-hint-btn'), s.querySelector('.lc-hint'));
    tog(s.querySelector('.lc-reveal-btn'), s.querySelector('.lc-answer'));
    return s;
  }
  [1, 2, 3].forEach((i) => $('#lcs').appendChild(lc(i, i - 1)));
  if (fault === 'console') console.error('fixture: deliberate console error');
  if (fault === 'axe') $('#extra').innerHTML = '<button class="icon-only"></button>';
  if (fault === 'scroll') $('#extra').innerHTML = '<div style="width:900px;height:4px;background:var(--line)"></div>';
  $('#n').addEventListener('input', (e) => { state = { n: +e.target.value }; render(); });
  document.querySelectorAll('[data-code-tab]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-code-pane]').forEach((p) => { p.hidden = p.dataset.codePane !== b.dataset.codeTab; });
  }));
  const load = fetch('data/fx.json').then((r) => r.json()).then(async (d) => {
    values = d.values;
    if (fault === 'payload') for (let k = 0; k < 31; k++) await fetch('data/fx-pad.json?k=' + k).then((r) => r.text());
    if (fault === 'slow') await new Promise((r) => setTimeout(r, 1700));
    render(); performance.mark('lab:first-render');
  });
  window.__lab = {
    id: 'fx', ready: load,
    states: { all: { n: 5 }, first2: { n: 2 } },
    setState(o) { state = Object.assign({}, state, o); render(); return Promise.resolve(); },
    getState() { return Object.assign({}, state); },
    readouts, code() { return codeFor(state.n); },
  };
})();
</script>
</body>
</html>
